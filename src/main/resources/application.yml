spring:
  datasource:
    # sslmode: 외부 관리형 DB(Neon 등)는 require. 로컬/내부는 prefer(있으면 SSL, 없으면 평문).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:testdb}?sslmode=${DB_SSLMODE:prefer}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:testuser}
    password: ${DB_PASSWORD:testpassword}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    placeholders:
      legacyOwnerEmail: ${TODO_LEGACY_OWNER_EMAIL:}

server:
  port: ${PORT:8080}

# Google Places API(New) (장소 검색 프록시). 키는 Render 환경변수 GOOGLE_PLACES_KEY로만 주입.
google:
  places-key: ${GOOGLE_PLACES_KEY:}

# AI 코스 큐레이션(Claude). 키는 Render 환경변수 ANTHROPIC_API_KEY로만. 미설정 시 503 CURATION_NOT_CONFIGURED.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

# 비밀번호 재설정 메일(Resend HTTP API). 키는 Render 환경변수 RESEND_API_KEY로만.
# from은 도메인 인증 전이면 onboarding@resend.dev만 가능(기본값). 미설정 시 발송 대신 로그.
resend:
  api-key: ${RESEND_API_KEY:}
mail:
  from: ${MAIL_FROM:onboarding@resend.dev}
# 재설정 링크가 가리킬 프론트 웹 주소.
app:
  web-url: ${APP_WEB_URL:https://test-todo-app-f4c9a.web.app}

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hs256}
  # access 토큰 7일(604800000ms). 짧으면(1h) refresh가 잦아 조기 로그아웃 위험↑.
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:604800000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
